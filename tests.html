<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>揭棋引擎自检</title>
    <style>
      body {
        margin: 0;
        padding: 32px 20px;
        background: #f4efe5;
        color: #2b2117;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
      }
      h1 {
        margin: 0 0 8px;
        font: 600 24px/1.3 "Songti SC", "Noto Serif SC", serif;
      }
      p {
        color: #7a6a55;
        font-size: 14px;
      }
      a {
        color: #a62b23;
      }
      #summary {
        display: inline-block;
        margin: 8px 0 20px;
        padding: 8px 14px;
        border-radius: 999px;
        font-weight: 600;
        font-size: 14px;
      }
      #summary.ok {
        background: #e3f4e8;
        color: #17663a;
      }
      #summary.bad {
        background: #fbe4e0;
        color: #9c241a;
      }
      ol {
        margin: 0;
        padding-left: 24px;
        line-height: 1.9;
        font-size: 14px;
      }
      li.pass {
        color: #17663a;
      }
      li.fail {
        color: #9c241a;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>揭棋规则引擎自检</h1>
      <p>在浏览器里直接运行，不需要 Node。<a href="./index.html">返回棋盘</a></p>
      <div id="summary">运行中…</div>
      <ol id="results"></ol>
    </main>
    <script type="module">
      import { runTests } from "./tests/engine.test.js";
      runTests(
        document.getElementById("results"),
        document.getElementById("summary"),
      );
    </script>
  </body>
</html>
